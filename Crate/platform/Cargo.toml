[package]
name = "splaude-platform"
description = "Per-OS integration behind one trait set: hotkey, injector, focus, audio, tray, autostart."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
cpal = "0.18"
dirs = "6.0.0"
enigo = "0.6"
global-hotkey = "0.8.0"
splaude-core = { version = "0.4.0", path = "../core" }

# Windows and macOS only, deliberately. The only thing here that touches the
# clipboard is `Injector::paste`, and its only caller is the carve-out for
# applications that re-encode keystrokes by keycode — which is gated on
# `focus::executable`, and that answers `None` on Linux. So the Linux build
# would carry an X11 clipboard owner it can never reach; `paste` returns a
# clear error there instead.
#
# `default-features = false` drops `image-data`, which would otherwise bring the
# whole `image` crate in to support a clipboard format this app never puts
# anything but text on. It also bounds what the paste path can put back: text
# only, so a snapshot of an image or a file list is not recoverable.
[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3.6.1", default-features = false }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # `SendInput`, for the one character enigo will not carry as a payload.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # The control channel — a named pipe, which doubles as the single-instance
    # claim.
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
winreg = "0.56.0"

# The injection test owns a real window and reads characters back out of it, so
# it needs the same Win32 surface the crate itself does. A dev-dependency
# because an integration test links the crate rather than living inside it, and
# so cannot borrow its dependencies.
[target."cfg(windows)".dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    # `WNDCLASSW` carries an `HBRUSH`, so registering a class needs GDI even
    # though nothing here draws.
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    # `AttachThreadInput` + `GetCurrentThreadId`, to get past the foreground
    # lock. Without them the suite passes once and never again.
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
