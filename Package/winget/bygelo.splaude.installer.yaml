# Where the binary is and what it hashes to. Both filled in by the release
# workflow, because a hash typed by hand is a hash that is wrong.
PackageIdentifier: bygelo.splaude
PackageVersion: "{{VERSION}}"
InstallerLocale: en-US
MinimumOSVersion: 10.0.17763.0
# Portable, because that is what splaude is: one self-contained .exe with
# nothing to install and nothing to uninstall. winget puts it on PATH, which is
# what makes `splaude --toggle` reachable from a launcher or a script.
InstallerType: portable
Commands:
  - splaude
ReleaseDate: "{{DATE}}"
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/bygelo/splaude/releases/download/v{{VERSION}}/splaude-{{VERSION}}-windows-x86_64.exe
    InstallerSha256: "{{SHA256}}"
ManifestType: installer
ManifestVersion: 1.6.0
