ShortDescription: Push-to-talk dictation that types at your cursor.
Description: |-
  Hold a hotkey, talk, release — the text lands at your cursor in whatever app
  you were typing in, and it appears as you speak rather than after you stop.

  splaude authenticates with the Claude Code OAuth credential already on the
  machine, so if you have run `claude` once there is nothing else to set up.
  The speech endpoint it uses is undocumented and internal to Anthropic, and
  splaude is a third-party client of it rather than an Anthropic product; read
  the caveat in the README before installing. A Deepgram key of your own can be
  used instead.
